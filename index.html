<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike - Just Do It</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="nike-brand">
            <svg xmlns="http://www.w3.org/2000/svg" 
            width="80" 
            height="29" 
            viewBox="135.5 361.38 1000 356.39" 
            aria-label="Nike" 
            role="img" 
            style="fill: #ffffff; display: block;">
                <path 
                d="M245.8075 717.62406c-29.79588-1.1837-54.1734-9.3368-73.23459-24.4796-3.63775-2.8928-12.30611-11.5663-15.21427-15.2245-7.72958-9.7193-12.98467-19.1785-16.48977-29.6734-10.7857-32.3061-5.23469-74.6989 15.87753-121.2243 18.0765-39.8316 45.96932-79.3366 94.63252-134.0508 7.16836-8.0511 28.51526-31.5969 28.65302-31.5969.051 0-1.11225 2.0153-2.57652 4.4694-12.65304 21.1938-23.47957 46.158-29.37751 67.7703-9.47448 34.6785-8.33163 64.4387 3.34693 87.5151 8.05611 15.898 21.86731 29.6684 37.3979 37.2806 27.18874 13.3214 66.9948 14.4235 115.60699 3.2245 3.34694-.7755 169.19363-44.801 368.55048-97.8366 199.35686-53.0408 362.49439-96.4029 362.51989-96.3672.056.046-463.16259 198.2599-703.62654 301.0914-38.08158 16.2806-48.26521 20.3928-66.16827 26.6785-45.76525 16.0714-86.76008 23.7398-119.89779 22.4235z"
                />
            </svg>
        </div>
        <nav class="nav-container" 
        aria-label="Navegação principal">
            <ul class="menu">
                <li>
                    <a href="#">Men</a>
                </li>
                <li>
                    <a href="#">Women</a>
                </li>
                <li>
                    <a href="#">Kids</a>
                </li>
                <li>
                    <a href="#">Sale</a>
                </li>
                <li>
                    <a href="#">FIGURINHAS</a>
                </li>
            </ul>
        </nav>
        <div class="header-utilities">
            <a href="login.html" 
            class="login-link">
                Entrar
            </a>
            <div class="search-bar-placeholder">
                <svg 
                class="icon-search" 
                viewBox="0 0 24 24" 
                width="15" 
                height="15" 
                aria-hidden="true">
                    <circle 
                    cx="10.5" 
                    cy="10.5" 
                    r="6.5" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2"/>
                    <line 
                    x1="15.2" 
                    y1="15.2" 
                    x2="21" 
                    y2="21" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round"/>
                </svg>
                <span>Search</span>
            </div>
            <a href="#" 
            class="cart-link" 
            aria-label="Carrinho de compras">
                <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                width="22" 
                height="22" 
                fill="white" 
                aria-hidden="true">
                    <path 
                    d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
                    />
                </svg>
            </a>
        </div>
    </header>
    <main class="main-section">
        <div class="mark-brand">
            <h1>JUST<br>DO<br>IT.</h1>
        </div>
        <div class="product-showcase">
            <div class="product-display">
                <div class="shoe-stage">
                    <div class="container-img">
                        <img src="pngwing.com (1).png" alt="Nike Air Max Pre-Day">
                    </div>
                    <div class="rotation-ring" aria-hidden="true">
                        <div class="rotation-arrows">&#9664; &#9654;</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="shoe-details">
            <h2>Nike Air Max<br>Pre&#8209;Day</h2>
            <p class="price">$200</p>
        </div>
    </main>
    <footer class="footer-cards">
        <ul class="container-cards">
            <li class="card">
                <span class="card-thumb" style="--thumb-tint:#3a1014">
                    <img src="images/hurane.png" alt="">
                </span>
                <div class="card-info">
                    <h3>Nike Air Hurane</h3>
                    <p class="card-price">$190</p>
                    <div class="rating" aria-label="4 de 5 estrelas">
                        <span aria-hidden="true">★★★★<span class="star-empty">★</span></span>
                    </div>
                </div>
            </li>
            <li class="card">
                <span class="card-thumb" style="--thumb-tint:#102433">
                    <img src="images/270-removebg-preview.png" alt="">
                </span>
                <div class="card-info">
                    <h3>Air Max 270</h3>
                    <p class="card-price">$180</p>
                    <div class="rating" aria-label="4 de 5 estrelas">
                        <span aria-hidden="true">★★★★<span class="star-empty">★</span></span>
                    </div>
                </div>
            </li>
            <li class="card">
                <span class="card-thumb" style="--thumb-tint:#1c1c1c">
                    <img src="images/170-removebg-preview.png" alt="">
                </span>
                <div class="card-info">
                    <h3>Air Max 170</h3>
                    <p class="card-price">$180</p>
                    <div class="rating" aria-label="3 de 5 estrelas">
                        <span aria-hidden="true">★★★<span class="star-empty">★★</span></span>
                    </div>
                </div>
            </li>
            <li class="card">
                <span class="card-thumb" style="--thumb-tint:#341622">
                    <img src="images/150.png" alt="">
                </span>
                <div class="card-info">
                    <h3>Air Max 150</h3>
                    <p class="card-price">$180</p>
                    <div class="rating" aria-label="4 de 5 estrelas">
                        <span aria-hidden="true">★★★★<span class="star-empty">★</span></span>
                    </div>
                </div>
            </li>
        </ul>
    </footer>
</body>
</html>
